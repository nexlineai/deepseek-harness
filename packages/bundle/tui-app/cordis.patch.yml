# The dsh-tui-app bundle patch: interactive terminal mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses this app's flags and --help, then
# the REPL driver creates an Agent through the core registry, streams assistant
# chunks live to the terminal, and re-prompts until the user exits.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui-app/startup'

    # Reads its entry prompt and stream mode from the ordinary tuiStartup provider.
    - id: tui-runner
      name: '@deepseek-ai/dsh-tui-app'
      inject: [tuiStartup]
      config:
        task: !!js ctx.tuiStartup.task
        streaming: !!js ctx.tuiStartup.streaming
